# looker-extractor — workspace root
#
# Members:
#   packages/looker-extractor      — CLI + core (currently the v0.3.0a0 passthru reference)
#   packages/looker-extractor-sdk  — Plugin SDK (Plugin Protocol + helpers; stub through Phase 1)
#
# Phase 4+ adds additional plugin packages here under packages/looker-extractor-plugin-*.
#
# Workspace usage:
#   uv sync                                                # install all members into shared .venv
#   uv sync --extra dev                                    # + dev deps (pytest, ruff, datamodel-code-generator)
#   uv run --package looker-extractor looker-extractor --help
#   uv build --package looker-extractor --no-sources       # build wheel for PyPI (strips workspace path refs)

[tool.uv.workspace]
members = ["packages/*"]
