# Looker fields manifest — BUNDLED DEFAULT.
# Source of truth: docs/FIELD_SPEC.md
# Regenerate: .venv/bin/python scripts/parse_field_spec_to_manifest.py
# schema_version: 1.0.0

schema_version: 1.0.0
entity: field
output_grain:
- project_name
- model_name
- explore_name
- field_name
columns:
- name: project_name
  type: str
  api_source: field.project_name
  fallback_source: explore.project_name
  default: ''
  description: Field-level preferred; falls back to explore-level
- name: model_name
  type: str
  api_source: context.model_name
  default: ''
  description: Always from explore context — THE fix for duplication
- name: explore_name
  type: str
  api_source: explore.name
  default: ''
  description: Explore name within the model
- name: field_name
  type: str
  api_source: field.name
  default: ''
  description: 'Fully-qualified: `view_name.field_name` (e.g., `order_items.total_revenue`)'
- name: category
  type: str
  api_source: field.category
  default: ''
  description: '`"dimension"`, `"measure"`, `"filter"`, `"parameter"` — more reliable than array membership'
- name: field_type
  type: str
  api_source: field.type
  default: ''
  description: 'LookML type: `string`, `number`, `yesno`, `date_date`, `date_month`, `count`, `sum`, `average`, etc.'
- name: is_numeric
  type: bool
  api_source: field.is_numeric
  default: false
  description: True for numeric types
- name: is_timeframe
  type: bool
  api_source: field.is_timeframe
  default: false
  description: True for date/time types — dim group members have this set
- name: is_fiscal
  type: bool
  api_source: field.is_fiscal
  default: false
  description: True for fiscal calendar variants
- name: is_filter
  type: bool
  api_source: field.is_filter
  default: false
  description: True for filter-only fields
- name: dynamic
  type: bool
  api_source: field.dynamic
  default: false
  description: True if created via `dynamic_fields`, not in the LookML model
- name: label
  type: str
  api_source: field.label
  default: ''
  description: 'Fully-qualified: includes view label (e.g., `"Order Items Total Revenue"`)'
- name: label_short
  type: str
  api_source: field.label_short
  default: ''
  description: Without view prefix (e.g., `"Total Revenue"`)
- name: description
  type: str
  api_source: field.description
  default: ''
  description: LookML `description` parameter; empty string if unset
- name: view_name
  type: str
  api_source: field.view
  default: ''
  description: View this field appears under (may be join alias)
- name: view_label
  type: str
  api_source: field.view_label
  default: ''
  description: Human-readable view label for UI grouping
- name: original_view
  type: str
  api_source: field.original_view
  default: ''
  description: Where field is actually defined — differs from `view` when `from:` join alias is used
- name: group_label
  type: str
  api_source: field.field_group_label
  default: ''
  description: UI field group label; null mapped to empty string
- name: hidden
  type: bool
  api_source: field.hidden
  default: false
  description: True if hidden from explore UI (still extracted)
- name: sql
  type: str?
  api_source: field.sql
  default: null
  description: SQL expression from LookML (e.g., `${TABLE}.date`). **Requires `see_lookml` permission** — null without it
- name: source_file
  type: str
  api_source: field.source_file
  default: ''
  description: Relative file path (e.g., `views/order_items.view.lkml`)
- name: source_file_path
  type: str
  api_source: field.source_file_path
  default: ''
  description: 'Fully-qualified path: `project_name/views/file.lkml`'
- name: dimension_group
  type: str?
  api_source: field.dimension_group
  default: null
  description: Group name if this field is a dimension group member (e.g., `order_items.created`). Null for non-grouped fields
- name: scope
  type: str
  api_source: field.scope
  default: ''
  description: LookML scope, typically the view name
- name: primary_key
  type: bool
  api_source: field.primary_key
  default: false
  description: 'True if declared as `primary_key: yes`'
- name: value_format
  type: str?
  api_source: field.value_format
  default: null
  description: Explicit LookML `value_format` string
- name: value_format_name
  type: str?
  api_source: field.value_format_name
  default: null
  description: Named format (e.g., `decimal_2`, `usd`)
- name: sortable
  type: bool
  api_source: field.sortable
  default: true
  description: Whether field can be sorted in queries
- name: can_filter
  type: bool
  api_source: field.can_filter
  default: true
  description: Whether field can be used in filters
- name: suggest_dimension
  type: str
  api_source: field.suggest_dimension
  default: ''
  description: Dimension used for suggest queries
- name: suggest_explore
  type: str
  api_source: field.suggest_explore
  default: ''
  description: Explore used for suggest queries
- name: tags
  type: list[str]
  api_source: field.tags
  default: []
  description: Arbitrary string tags from LookML `tags` parameter. Serialized as JSON array in JSONL/CSV
- name: times_used
  type: int
  api_source: field.times_used
  default: 0
  description: Count of query usage. Valuable for identifying dead fields
- name: explore_label
  type: str
  api_source: explore.label
  default: ''
  description: Human-readable explore label
- name: explore_description
  type: str?
  api_source: explore.description
  default: null
  description: Explore description; null if unset
- name: explore_group_label
  type: str?
  api_source: explore.group_label
  default: null
  description: Navigation menu grouping
- name: explore_hidden
  type: bool
  api_source: explore.hidden
  default: false
  description: Whether explore is hidden in nav
- name: explore_connection
  type: str
  api_source: explore.connection_name
  default: ''
  description: Database connection name
- name: explore_view_name
  type: str
  api_source: explore.view_name
  default: ''
  description: Base view of the explore
derived_columns:
- name: extracted_at
  type: str
  expression: Generated
  deterministic: false
  source_section: Extraction Metadata
  description: ISO 8601 UTC timestamp of extraction
- name: schema_version
  type: str
  expression: Hardcoded
  deterministic: true
  source_section: Extraction Metadata
  description: '`"1.1.0"` — incremented on breaking changes'
- name: seen_in_model_count
  type: int
  expression: Count distinct `model_name` per `field_name`
  deterministic: true
  source_section: Seen-In Enrichment (Computed Post-Extraction)
  description: 1 = single model, >1 = shared across models
- name: seen_in_explore_count
  type: int
  expression: Count distinct `explore_name` per `field_name`
  deterministic: true
  source_section: Seen-In Enrichment (Computed Post-Extraction)
  description: How many explores expose this field
- name: total_times_used
  type: int
  expression: Sum of `times_used` per `field_name`
  deterministic: true
  source_section: Seen-In Enrichment (Computed Post-Extraction)
  description: Aggregate usage across all appearances
- name: seen_models
  type: list[str]
  expression: Distinct `model_name` values
  deterministic: true
  source_section: Seen-In Enrichment (Computed Post-Extraction)
  description: JSON array of model names
- name: seen_explores
  type: list[str]
  expression: Distinct `model::explore` pairs
  deterministic: true
  source_section: Seen-In Enrichment (Computed Post-Extraction)
  description: JSON array of "model::explore" strings
exclusions:
- align
- drill_fields
- enumerations
- fill_style
- fiscal_month_offset
- has_allowed_values
- has_drills_metadata
- links
- map_layer
- sql_case
- '`field.filters` (on measures)'
- suggestions
- synonyms
- label_from_parameter
- lookml_link
- lookml_expression
- datatype
- convert_tz
- period_over_period_params
- time_interval
- user_attribute_filter_types
- week_start_day
- requires_refresh_on_sort
- strict_value_format
- permanent
- suggestable
