# Per-entity per-instance override manifest.
#
# Post-pivot shape: this file is a NARROW override layer on top of the
# swagger-generated pydantic types. It does NOT define output columns; the
# output IS the swagger entity's natural pydantic shape dumped to JSON or
# Parquet. The downstream warehouse (BigQuery + dbt) handles flattening,
# derivation, and dedup.
#
# Purpose:
#   extra_fields   : fields a specific Looker instance returns that the
#                    swagger lacks. Documented here so they survive
#                    schema codegen; runtime catches via extra="allow".
#   type_overrides : widen swagger-declared types when an instance returns
#                    values the swagger doesn't permit.
#
# This default ships empty -- a clean Looker instance needs no overrides.
# Per-instance manifests should be placed at
#   ~/.config/looker-fields/manifest.yaml
# or pointed at via $LOOKER_FIELDS_MANIFEST or --manifest-path.

schema_version: "2.0"
entity: explore_field

extra_fields: {}
type_overrides: {}
