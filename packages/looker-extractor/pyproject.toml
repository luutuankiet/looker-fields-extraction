[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looker-extractor"
version = "0.3.0a0"
description = "Plugin-based passthru extractor for the Looker v4.0 API (reference plugin: lookml_fields)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joon Solutions"},
]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "orjson>=3.10",
    "pyarrow>=15.0",
    "looker-sdk>=24.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0.3",
    "looker-extractor-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "datamodel-code-generator>=0.25",
    "looker-extractor-tests-plugin>=0.1.0a0,<0.2",
]

[project.scripts]
looker-extractor = "looker_extractor.cli:app"
lx = "looker_extractor.cli:app"  # short alias

[tool.uv.sources]
# Resolve SDK + tests-plugin from the workspace at dev time; published wheel
# uses PyPI (run `uv build --no-sources` to strip workspace refs for release).
looker-extractor-sdk = { workspace = true }
looker-extractor-tests-plugin = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/looker_extractor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.entry-points."looker_extractor.plugins"]
lookml_fields = "looker_extractor.plugins.lookml_fields.plugin:LookmlFieldsPlugin"
