[project]
name = "looker-extractor-tests-plugin"
version = "0.1.0a0"
description = "Pytest base classes for looker-extractor plugin conformance tests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ken Luu", email = "luutuankiet.ftu2@gmail.com"}]
keywords = ["looker", "extractor", "plugin", "testing", "conformance", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "looker-extractor-sdk>=0.1.0,<0.2",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/luutuankiet/looker-extractor"
Issues = "https://github.com/luutuankiet/looker-extractor/issues"
Source = "https://github.com/luutuankiet/looker-extractor/tree/main/packages/looker-extractor-tests-plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looker_extractor_tests_plugin"]

[tool.hatch.build.targets.sdist]
include = [
  "src/looker_extractor_tests_plugin",
  "README.md",
  "pyproject.toml",
]

[tool.uv.sources]
looker-extractor-sdk = { workspace = true }
