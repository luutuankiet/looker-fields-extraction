[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looker-extractor-plugin-users"
version = "0.1.0a0"
description = "looker-extractor plugin: extract Looker users records."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "luutuankiet", email = "luutuankiet.ftu2@gmail.com"},
]
dependencies = [
    "looker-extractor-sdk>=0.1.0,<0.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "looker-extractor-tests-plugin>=0.1.0a0,<0.2",
    "datamodel-code-generator>=0.25",
]

[project.entry-points."looker_extractor.plugins"]
users = "looker_extractor_plugin_users.plugin:UsersPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/looker_extractor_plugin_users"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
looker-extractor-sdk = { workspace = true }
looker-extractor-tests-plugin = { workspace = true }
