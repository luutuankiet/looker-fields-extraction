[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looker-extractor-sdk"
version = "0.1.0"
description = "Plugin SDK for looker-extractor (Plugin Protocol + helpers)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joon Solutions"},
]
# Intentionally minimal: SDK depends ONLY on pydantic so plugin authors
# don't pull the full looker-extractor dependency tree just to declare
# a Plugin class. See ARCHITECTURE.md "Agent 1: Plugin patterns survey"
# for the dbt-adapters separation rationale.
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/looker_extractor_sdk"]

[tool.hatch.build.targets.wheel.force-include]
# Ship AUTHORING.md in the wheel under looker_extractor_sdk/ so installed users
# can `importlib.resources.files('looker_extractor_sdk').joinpath('AUTHORING.md')`.
"AUTHORING.md" = "looker_extractor_sdk/AUTHORING.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/looker_extractor_sdk",
  "AUTHORING.md",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
