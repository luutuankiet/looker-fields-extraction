[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looker-extractor-sdk"
version = "0.1.0a0"
description = "Plugin SDK for looker-extractor (Plugin Protocol + helpers)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joon Solutions"},
]
# Intentionally minimal: SDK depends ONLY on pydantic so plugin authors
# don't pull the full looker-extractor dependency tree just to declare
# a Plugin class. See ARCHITECTURE.md "Agent 1: Plugin patterns survey"
# for the dbt-adapters separation rationale.
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/looker_extractor_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100
